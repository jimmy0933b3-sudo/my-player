name: Build and publish signed My Player APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: my-player-release-main
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''
      - name: Install platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile application and run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Restore the fixed Action signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/my-player-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$SIGNING_FILE"
          chmod 600 "$SIGNING_FILE"
          test -s "$SIGNING_FILE"
          keytool -list -keystore "$SIGNING_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"

      - name: Assemble signed Release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify package, version and signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          SIGNER_SHA256="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$SIGNER_SHA256"
          echo "SIGNER_SHA256=$SIGNER_SHA256" >> "$GITHUB_ENV"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          HEADER="${BADGING%%$'\n'*}"
          [[ "$HEADER" == *"name='com.jimmy0933.myplayer'"* ]]
          [[ "$HEADER" == *"versionCode='$((1000 + GITHUB_RUN_NUMBER))'"* ]]
          [[ "$HEADER" == *"versionName='1.0.$GITHUB_RUN_NUMBER'"* ]]
          echo "Verified APK signed by SHA-256: $SIGNER_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish current APK and keep only the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit is available: stale build skipped"
            exit 0
          fi
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null |
            sed -n 's/^Signer SHA256: //p' | head -n 1 || true)"
          if [[ -n "$OLD_SHA" && "$OLD_SHA" != "$SIGNER_SHA256" ]]; then
            echo "::error::Signing key differs from the most recent release"
            exit 1
          fi
          TAG="v1.0.$GITHUB_RUN_NUMBER"
          APK_NAME="MyPlayer-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$APK_NAME" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$APK_NAME" \
              --target "$GITHUB_SHA" --latest \
              --title "My Player $TAG｜最新版 APK" \
              --notes "$(printf '原生圖片／影片播放器：全部/圖片/影片篩選、日期與大小排序、上下滑動、影片左右快轉及雙指縮放。\nSigner SHA256: %s\nCommit: %s' "$SIGNER_SHA256" "$GITHUB_SHA")"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$APK_NAME"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            while IFS= read -r old; do
              [[ -z "$old" || "$old" == "$TAG" ]] && continue
              gh release delete "$old" --yes --cleanup-tag
            done
          gh release view "$TAG" --json url,assets --jq '{url,assets:[.assets[].name]}'
